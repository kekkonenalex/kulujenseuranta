<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <!-- What the page may load: itself, the pinned database library (and the Excel one, when exporting)
       from jsDelivr, and the Supabase project. Nothing else (F6). -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data:; connect-src 'self' https://wqibkufakgdmzcovmdos.supabase.co wss://wqibkufakgdmzcovmdos.supabase.co; manifest-src 'self'; worker-src 'self'; base-uri 'none'; form-action 'none'; object-src 'none'">
  <meta name="referrer" content="no-referrer">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#000000">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Expenses">
  <title>Otso - Expenses</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/svg+xml" href="icons/icon.svg">
  <link rel="apple-touch-icon" href="icons/icon-180.png?v=2">
  <!-- What the iPhone shows while the app starts: the loading screen's picture (tools/make_icons.py). -->
  <link rel="apple-touch-startup-image" media="screen and (device-width: 390px) and (device-height: 844px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" href="icons/launch-390x844.png">
  <link rel="apple-touch-startup-image" media="screen and (device-width: 393px) and (device-height: 852px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" href="icons/launch-393x852.png">
  <link rel="apple-touch-startup-image" media="screen and (device-width: 402px) and (device-height: 874px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" href="icons/launch-402x874.png">
  <link rel="apple-touch-startup-image" media="screen and (device-width: 430px) and (device-height: 932px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" href="icons/launch-430x932.png">
  <link rel="apple-touch-startup-image" media="screen and (device-width: 440px) and (device-height: 956px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" href="icons/launch-440x956.png">
  <link rel="preload" href="fonts/schibsted-grotesk-700-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="fonts/atkinson-hyperlegible-400-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <!-- The loading screen, until there's something to look at: the bear in rays and the name, on black, where the
       iPhone's launch image (icons/launch-*.png) has them, so opening the app has no flash or jump. -->
  <div id="boot" class="boot" aria-hidden="true">
    <div class="boot-mark" id="boot-mark"></div>
    <p class="boot-name">Expenses</p>
  </div>

  <!-- iOS 26 blurs the top edge of a home-screen app unless a fixed, full-width, solid box covers it; then it uses
       that box's colour (the same fix as the Otso app's, 6 Nov 2026). -->
  <div class="edge" aria-hidden="true"></div>

  <!-- No settings -->
  <section id="view-config" class="screen-center" hidden>
    <div class="card narrow">
      <h1 class="h-display">Otso <span class="accent">Expenses</span></h1>
      <p>The Supabase settings are missing. Fill in <code>js/config.js</code> (the project's URL and its
        publishable key) and open the app again.</p>
    </div>
  </section>

  <!-- Signing in -->
  <section id="view-auth" class="screen-center" hidden>
    <div class="rays rays-boot" aria-hidden="true"></div>
    <form id="auth-form" class="card narrow auth" novalidate>
      <div class="auth-mark" id="auth-mark"></div>
      <h1 class="h-display">Otso <span class="accent">Expenses</span></h1>
      <p class="muted">Sign in to see your month.</p>
      <label for="auth-email">Email</label>
      <input type="email" id="auth-email" autocomplete="email" inputmode="email" required>
      <label for="auth-password">Password</label>
      <input type="password" id="auth-password" autocomplete="current-password" required minlength="6">
      <p id="auth-error" class="alert alert-error" role="alert" hidden></p>
      <button type="submit" id="auth-submit" class="btn btn-primary btn-block">Sign in</button>
    </form>
  </section>

  <!-- The app -->
  <div id="view-app" hidden>
    <div class="rays rays-top" aria-hidden="true"></div>
    <header class="topbar">
      <div class="topbar-row">
        <span id="topbar-mark" class="topbar-mark"></span>
        <h1 id="topbar-title" class="topbar-title">Month</h1>
        <span id="offline-badge" class="badge" hidden>Offline</span>
        <button type="button" id="btn-settings" class="icon-btn" aria-label="Settings"></button>
      </div>
      <nav class="month-nav" id="month-nav" aria-label="Month">
        <button type="button" class="icon-btn" data-month-prev aria-label="Previous month"></button>
        <span class="month-label" data-month-label aria-live="polite"></span>
        <button type="button" class="icon-btn" data-month-next aria-label="Next month"></button>
      </nav>
    </header>

    <main id="app-main">
      <section id="panel-month" class="panel" aria-labelledby="topbar-title"></section>
      <section id="panel-expenses" class="panel" aria-labelledby="topbar-title" hidden></section>
      <section id="panel-otso" class="panel" aria-labelledby="topbar-title" hidden></section>
    </main>

    <button type="button" id="fab" class="fab" aria-label="Log an expense"></button>

    <nav class="tabbar" id="tabbar" aria-label="Views">
      <button type="button" class="tab" data-view="month"><span class="tab-icon" data-icon="month"></span><span>Month</span></button>
      <button type="button" class="tab" data-view="expenses"><span class="tab-icon" data-icon="list"></span><span>Expenses</span></button>
      <button type="button" class="tab" data-view="otso"><span class="tab-icon" data-icon="bear"></span><span>Otso</span></button>
    </nav>
  </div>

  <!-- The sheet: every editor and every detail opens here -->
  <div id="sheet" class="sheet" hidden>
    <div class="sheet-backdrop" data-sheet-close></div>
    <div id="sheet-panel" class="sheet-panel" role="dialog" aria-modal="true" aria-labelledby="sheet-title" tabindex="-1">
      <div class="sheet-head">
        <h2 id="sheet-title" class="sheet-title"></h2>
        <button type="button" class="icon-btn" data-sheet-close aria-label="Close" id="sheet-close"></button>
      </div>
      <div id="sheet-body" class="sheet-body"></div>
    </div>
  </div>

  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

  <!-- The database library, pinned to one version and checked against its hash (F6). -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.118.0/dist/umd/supabase.js"
          integrity="sha384-TcHRA3zBbn+Lexh5n+Oil4guNPOS3rjNDpGRAN46u/s/mB2IZ50ceC6TYDU2yvgK"
          crossorigin="anonymous"></script>
  <script type="module" src="js/app.js"></script>
</body>
</html>
